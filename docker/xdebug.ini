; zend_extension=xdebug is loaded by docker-php-ext-enable (see Dockerfile) —
; declaring it again here would load it twice.

; Overridable at runtime via the XDEBUG_MODE env var, e.g. XDEBUG_MODE=off
xdebug.mode=debug,develop
xdebug.start_with_request=yes

; Connect back to the IDE. host.docker.internal works on Docker Desktop
; (Mac/Windows); on Linux add `extra_hosts: ["host.docker.internal:host-gateway"]`
; in docker-compose.yml (already set there). discover_client_host is a fallback
; for setups where that hostname isn't resolvable.
xdebug.client_host=host.docker.internal
xdebug.discover_client_host=true
xdebug.client_port=9003
