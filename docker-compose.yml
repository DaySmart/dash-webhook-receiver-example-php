services:
  app:
    build:
      context: .
      target: dev
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    environment:
      XDEBUG_MODE: "${XDEBUG_MODE:-debug,develop}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: webhook_receiver
      DB_USERNAME: webhook
      DB_PASSWORD: secret
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env
    depends_on:
      - db
    restart: unless-stopped

  web:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: webhook_receiver
      MYSQL_USER: webhook
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  db_data:
  vendor:
